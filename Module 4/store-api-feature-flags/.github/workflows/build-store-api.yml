name: Build and Publish Store API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME Actions variable under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "IMAGE=$DOCKERHUB_USERNAME/pro2004-store-api:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Get the repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies and run tests
        working-directory: .
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Build the image
        run: docker build -t "$IMAGE" .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the image
        run: docker push "$IMAGE"
