name: Deploy Store API

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker Hub configuration
        env:
          # Set DOCKERHUB_USERNAME in repository Settings > Secrets and variables > Actions > Variables.
          # An empty username produces an invalid image tag starting with '/'.
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME Actions variable under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "IMAGE=$DOCKERHUB_USERNAME/pro2004-store-api:$GITHUB_SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies and run tests
        working-directory: .
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Build the image
        run: docker build -t "$IMAGE" .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the image
        run: docker push "$IMAGE"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}
